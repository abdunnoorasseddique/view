<style>

.rt{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:11.5px;font-weight:600;color:var(--mut)}

.mvmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.mvfoot .btn{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff;padding:5px 12px;font-size:12.5px}
.btn.k{background:var(--ink);border-color:var(--ink);color:var(--bg);padding:5px 12px;font-size:12.5px}
.empty{background:var(--sf);border:1px dashed var(--line);border-radius:14px;padding:26px 14px;text-align:center;color:var(--mut);font-size:12.5px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}

.hd{padding:14px 14px 6px;font-weight:600}

.chips .lbl{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:12.5px;color:var(--mut);margin-inline-end:6px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 6px;font-size:12px;font-weight:600;transition:transform .2s ease,box-shadow .2s ease}
button.chip:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(12,34,51,.12)}
.chip .av{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;background:var(--c,#8B6FD1);flex:none}

.pda{font-size:10.5px;font-weight:700;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:99px;padding:2px 8px;flex:none}
.toast{position:fixed;inset-block-end:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;opacity:0;transform:translateY(12px);transition:opacity .3s ease,transform .3s cubic-bezier(.22,.75,.3,1);pointer-events:none;z-index:9}

@media (max-width:1100px){.res,.cols{grid-template-columns:1fr}}

@keyframes bob{0%,100%{transform:translateY(-1.6px)}50%{transform:translateY(1.6px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sea .ship{animation:bob 6s ease-in-out infinite}
.sea .ship:nth-of-type(3n){animation-duration:7.8s;animation-delay:-2.4s}
.sea .ship:nth-of-type(3n+1){animation-duration:6.9s;animation-delay:-4.3s}

.route{animation:flow 2.6s linear infinite}
.sea svg text{direction:ltr}
@media (prefers-reduced-motion:reduce){animateMotion,animateTransform{display:none}.toast,.panel,.tip{transition:none}.sea .ship,#views>*,.route{animation:none}}
</style>

<body>
<div class="wrap">
 <header class="top">

 </header>

 </main>

<script>
const T={cont:['حاويات','#2D9CCB'],tank:['ناقلة','#E0584B'],bulk:['سائبة','#E39A1B'],pax:['ركاب','#8B6FD1'],gen:['بضائع عامة','#16906A']};
const SC={'تعمل على البضائع':'#16906A','راسية':'#4FB8DA','جاهزة للإبحار':'#8B6FD1','في المخطاف':'#E39A1B','تتحرك':'#EEF2F4','متوقعة':'#7FA6BA','مسودة':'#D9483B'};

document.addEventListener('mouseover',e=>{const g=e.target.closest('.sea .ship');if(g)tipShow(g,e.clientX,e.clientY)});
document.addEventListener('mousemove',e=>{if(e.target.closest('.sea .ship'))place(e.clientX,e.clientY)});
document.addEventListener('mouseout',e=>{const g=e.target.closest('.sea .ship');if(g&&!(e.relatedTarget&&g.contains(e.relatedTarget)))$('#tip').classList.remove('on')});
document.addEventListener('focusin',e=>{const g=e.target.closest&&e.target.closest('.sea .ship');if(g){const r=g.getBoundingClientRect();tipShow(g,r.left+r.width/2,r.bottom)}});
document.addEventListener('focusout',()=>$('#tip').classList.remove('on'));
function tick(){const n=new Date();$('#clk').textContent=n.toLocaleTimeString('en-GB');$('#dt').textContent=n.toLocaleDateString('ar-LY-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})}
show();tick();setInterval(tick,1000);
</script>
</body>
</html>
